name: AI Smoke Tests
on:
  pull_request:
    branches: [master, release/*]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-smoke-tests:
    name: AI Smoke Tests
    timeout-minutes: 120
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Yarn
        run: npm install -g yarn@1.22.22
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: npx playwright install
      - name: Run AI smoke tests
        run: |
          export NODE_OPTIONS="--max_old_space_size=10192"
          bun run test:e2e:ai:smoke
      - name: Create AI smoke test results directory
        if: ${{ !cancelled() }}
        run: |
          mkdir -p packaged-ai-smoke-results
          cp -r ./tests/test-results-ai packaged-ai-smoke-results/ || true
          cp -r ./tests/playwright-report-ai packaged-ai-smoke-results/ || true
      - name: Upload AI smoke test results artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ai-smoke-results
          path: packaged-ai-smoke-results/
          retention-days: 5
